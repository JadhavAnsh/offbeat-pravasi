name: EAS Preview Build

on:
  workflow_dispatch:
  push:
    branches:
      - preview
    paths:
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - "android/**"
      - "ios/**"

concurrency:
  group: eas-preview-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Trigger Android and iOS Simulator preview builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add EXPO_TOKEN to this repository's GitHub Actions secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Trigger Android preview build
        run: eas build --profile preview --platform android --non-interactive --no-wait

      - name: Trigger iOS Simulator preview build
        run: eas build --profile preview-simulator --platform ios --non-interactive --no-wait
